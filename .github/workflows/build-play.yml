name: Build BT Remote Pro Play AAB

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set target SDK 36
        run: |
          sed -i 's/compileSdk 35/compileSdk 36/' app/build.gradle
          sed -i 's/targetSdk 35/targetSdk 36/' app/build.gradle

      - name: Build Release AAB
        run: gradle :app:bundleRelease

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: BT-Remote-Pro-release
          path: app/build/outputs/bundle/release/app-release.aab
